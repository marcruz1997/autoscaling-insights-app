# Registra o catálogo no cluster. Depois disso, o operator aparece no OperatorHub.
# Gerado pelo build.sh em deploy/catalogsource.yaml.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: autoscaling-insights-catalog
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  image: __CATALOG_IMAGE__
  displayName: Autoscaling Insights (não oficial)
  publisher: "__PROVIDER__"
  grpcPodConfig:
    securityContextConfig: restricted
  updateStrategy:
    registryPoll:
      interval: 30m      # verifica novas versões a cada 30 minutos
